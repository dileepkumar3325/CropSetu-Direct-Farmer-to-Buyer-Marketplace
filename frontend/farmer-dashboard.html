<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Farmer Dashboard | Farmer Marketplace</title><link rel="stylesheet" href="styles.css"></head><body><header class="topbar"><a class="brand" href="index.html">🌿 Farmer Marketplace</a><nav><a href="farmer-dashboard.html" class="active">Dashboard</a><a href="buyer-dashboard.html">Browse Crops</a></nav><div class="top-actions"><span id="welcomeUser" class="muted"></span><button class="btn btn-outline" onclick="logout()">Logout</button></div></header><main class="dashboard-wrap"><aside class="sidebar"><div class="user-chip"><div class="avatar">👩‍🌾</div><div><b id="sideName">Farmer</b><small>Farmer</small></div></div><a href="farmer-dashboard.html" class="side-link active">▦ &nbsp; Dashboard</a><a href="#myCrops" class="side-link">🌱 &nbsp; My Crops</a><a href="buyer-dashboard.html" class="side-link">🛒 &nbsp; Browse Marketplace</a><a href="index.html" class="side-link">⌂ &nbsp; Home</a></aside><section class="dashboard-main"><div class="page-heading"><div><span class="eyebrow">FARMER WORKSPACE</span><h1>My Crop Listings</h1><p class="muted">Add and manage your available produce.</p></div></div><section class="panel form-panel"><h2 id="cropFormTitle">Add a crop</h2><form id="cropForm" class="crop-form"><input type="hidden" name="id"><label>Crop name<input name="name" placeholder="e.g. Tomato" required></label><label>Category<select name="category" required><option value="">Choose category</option><option>Vegetables</option><option>Fruits</option><option>Grains</option><option>Other</option></select></label><label>Farmer name<input name="farmerName" id="farmerNameInput" placeholder="Your name" required></label><label>Location<input name="location" placeholder="Village / City" required></label><label>Price per kg (₹)<input name="pricePerKg" type="number" min="0.01" step="0.01" placeholder="30" required></label><label>Available quantity (kg)<input name="availableKg" type="number" min="0.01" step="0.01" placeholder="100" required></label><label class="wide-field">Description<textarea name="description" rows="3" placeholder="Describe your crop"></textarea></label><div class="wide-field form-actions"><button class="btn btn-primary" type="submit">Save Crop</button><button class="btn btn-outline" type="reset" id="resetCropForm">Clear</button></div><p id="cropMessage" class="form-message wide-field" aria-live="polite"></p></form></section><section id="myCrops" class="panel listing-panel"><div class="panel-heading"><h2>Available listings</h2><button class="btn btn-outline" id="refreshCrops" type="button">Refresh</button></div><div id="farmerCropList" class="table-wrap"><p class="muted">Loading listings…</p></div></section></section></main><script src="app.js"></script></body></html>
